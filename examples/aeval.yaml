# A complete aeval configuration.
#
# Every key below is optional: `aeval run --dataset datasets/demo` works with no
# file at all. The file exists so a repeated workflow is written down once
# instead of retyped as flags, and so a run can be reproduced from one artefact.
#
# Two things are worth knowing before reading on:
#
#   * Keys are validated strictly. An unknown key is an error, not a silent
#     no-op, because a typo in a config file is otherwise indistinguishable from
#     an option that had no effect.
#   * Relative paths resolve against *this file's directory*, not the shell's
#     working directory. Paths below are written for a file living in
#     examples/, hence the ../ prefixes.
#
# Check the file without executing anything:
#
#   aeval validate --config examples/aeval.yaml

# dataset: a dataset directory or a dataset.yaml.
dataset: ../datasets/demo
# database: the SQLite file holding every run. Reports and the web UI read from
# it, so it is the artefact worth keeping.
database: ../agenteval.db

# ---------------------------------------------------------------------------
# run: the evaluation itself. These keys decode straight into engine.Config, so
# every engine option is reachable from here.
# ---------------------------------------------------------------------------
run:
  name: demo-local
  notes: "quickstart run from examples/aeval.yaml"

  # What each cell measures: agent (default), oracle or baseline.
  #
  # oracle applies the task's reference solution instead of running the agent,
  # and baseline grades the untouched workspace. Neither spends money. Both
  # store results with the same shape as an agent run, which is why the run
  # row records which one produced them: an unlabelled oracle run reads as a
  # model that scored 100% on everything.
  mode: agent

  # k for pass@k. Above 1, every task runs k times, each in a fresh sandbox.
  samples_per_task: 1
  # Cells executed at once. The main speed lever, and the main source of
  # provider rate limits.
  concurrency: 4

  # A cell must reach this score to count as passed. 1.0 means every grader
  # must pass, which is the usual "resolved" reading. Lower it to accept
  # partial credit as a pass.
  grader_threshold: 1.0

  # Durations are written the Go way and must carry a unit ("90s", "10m",
  # "1h30m"). A bare number is rejected: 600 seconds and 600 nanoseconds are
  # both plausible readings, and guessing is how a timeout silently becomes a
  # no-op that never fires.
  agent_timeout: 10m          # fallback for tasks that set no limits.timeout_s
  task_timeout: 20m           # bounds one cell end to end; 0 disables it

  # Extra attempts when the agent process could not be started *at all*.
  # Default 0: a run makes exactly the calls it was asked to make, and a
  # startup problem surfaces instead of being retried away. Agent outcomes
  # (timeout, non-zero exit, error result) are measurements, never retried.
  retries: 0

  # Which run-level metrics to compute. Empty uses the built-in default set;
  # list a subset here to keep a report focused. A form-3 custom metric may only
  # reference names in this list (plus custom metrics declared above it), so a
  # hand-picked list has to carry whatever the expressions below need --
  # resolved_count is listed for exactly that reason.
  metrics:
    - resolve_rate
    - pass_at_k
    - mean_score
    - resolved_count
    - total_cost_usd
    - mean_total_tokens
    - timeout_rate
    - harness_error_rate

  # Custom metrics are evaluated after the built-ins, in declaration order, so a
  # later expression may reference an earlier custom metric. Three forms exist:
  # aggregate, ratio, and expression over already-computed metrics.
  #
  # `direction` and `group` are presentation hints. They matter because a
  # built-in metric's name was curated by whoever wrote it, while a custom name
  # carries no such guarantee: nothing about "slow_cells" says whether more or
  # fewer is good, and a report that colours an increase green is worse than one
  # with no colour at all. `group` must be one of outcome/cost/token/effort/
  # latency/health to join an existing report section, else it lands in "other".
  custom_metrics:
    # Form 1 -- aggregate one numeric field over the run's cells, optionally
    # filtered. Filterable strings are task_id / category / difficulty /
    # stop_reason, plus `tags contains`. Numeric fields include passed, score,
    # turns, tool_calls, total_tokens, latency_ms, cost_usd and the error flags.
    - name: bugfix_resolve_rate
      description: Resolve rate restricted to bugfix tasks.
      unit: ratio
      group: outcome
      direction: up
      where: "category == 'bugfix'"
      field: passed
      agg: mean

    - name: slow_cells
      description: Cells whose wall-clock latency exceeded ten seconds.
      unit: count
      group: latency
      direction: down
      where: "latency_ms > 10000"
      agg: count

    # Form 2 -- a ratio of two aggregates. Ratios read better than raw counts
    # because they stay comparable across datasets of different sizes.
    - name: tokens_per_resolved
      description: Tokens spent per resolved cell.
      unit: tokens
      group: token
      direction: down
      numerator: {field: total_tokens, agg: sum}
      denominator: {field: passed, agg: sum}
      # A zero denominator is normal early in a bad run. Stating the answer
      # beats an implicit 0 that looks like a measurement.
      zero_denominator: 0

    # Form 3 -- arithmetic over built-in and previously declared metrics. This
    # is where a project's own definition of "a good run" usually belongs.
    - name: cost_per_resolved_guarded
      description: Cost per resolved cell, with a floor so the division is always defined.
      unit: usd
      group: cost
      direction: down
      expr: "total_cost_usd / max(resolved_count, 1)"

  # -------------------------------------------------------------------------
  # agent: the thing being evaluated. Only agent.kind is required.
  #
  # Only Claude Code is supported today (kind: claude_code). The *model* is
  # free-form and forwarded to the CLI untouched, so a gateway serving any
  # model works as long as the CLI can reach it via ANTHROPIC_BASE_URL.
  # -------------------------------------------------------------------------
  agent:
    kind: claude_code
    bin: claude                 # resolved on PATH *inside* the sandbox
    model: sonnet               # any id the endpoint accepts, e.g. deepseek-v4-pro
    fallback_model: haiku
    effort: high
    # Fully unattended. Required for evaluation: a permission prompt would hang
    # the run rather than fail it.
    permission_mode: bypassPermissions
    # The available tool set. Setting it explicitly matters in bare mode, where
    # the default set collapses to Bash/Edit/Read.
    tools: [Bash, Edit, Read, Glob, Grep, Write]
    allowed_tools: ["Bash(git:*)", "Bash(python3:*)"]
    disallowed_tools: [WebFetch, WebSearch]
    # Bounds assistant turns. Enforced by this harness by watching the event
    # stream, since the CLI exposes no --max-turns flag.
    max_turns: 30
    max_budget_usd: 2.00
    timeout: 10m

    # Credentials. env_from_host copies named variables from the harness
    # environment into the sandbox, which is how a key reaches a Docker
    # container without ever being written to a file. env sets literals, and
    # ${VAR} there expands from the harness environment -- an unset variable is
    # an error rather than an empty string, because an empty API key produces a
    # confusing auth failure much later.
    env_from_host: [ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL]
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

    # The clean-room preset, stated explicitly rather than relied on
    # implicitly: no user hooks, no auto-memory, no CLAUDE.md discovery, no MCP
    # servers the task did not ask for. An evaluation that silently inherits
    # the operator's ~/.claude is not reproducible on another machine.
    isolation:
      bare: true
      strict_mcp_config: true
      disable_slash_commands: true
      setting_sources: [project]

  # -------------------------------------------------------------------------
  # backend: where the agent runs.
  #
  # "local" is a directory plus a controlled environment -- fast, but with no
  # filesystem or network boundary. "docker" is the real sandbox; see
  # examples/aeval.docker.yaml.
  # -------------------------------------------------------------------------
  backend:
    kind: local
    # Forward the harness environment. Set false for a hermetic run in which
    # PATH and locale surprises cannot leak into the results.
    inherit_env: true

# ---------------------------------------------------------------------------
# report: the HTML produced by `aeval run --report` and `aeval report`.
# ---------------------------------------------------------------------------
report:
  dir: ../reports             # `aeval run` writes reports/<run-id>.html here
  title: Agent evaluation
  # These limits exist so a 500-cell run still produces a file that opens. When
  # the payload would exceed max_inline_bytes, per-cell *detail* is dropped in
  # priority order -- failing cells keep their evidence longest, passing cells
  # go first -- and every reduction is recorded in the report's warnings rather
  # than happening silently.
  max_events_per_task: 400
  max_tool_calls_per_task: 200
  max_field_bytes: 20000
  max_inline_bytes: 8388608   # 8 MiB
  # Keep the stored run configuration in the report. Off by default: a report is
  # meant to be shareable, and the config can name internal endpoints.
  include_raw_config: false

# ---------------------------------------------------------------------------
# serve: the results server (`aeval serve`).
# ---------------------------------------------------------------------------
serve:
  # Loopback by default. The server renders model-generated text and can delete
  # runs, so binding it to a public interface is a deliberate act.
  addr: 127.0.0.1:8787
  # The destructive run-deletion route stays off unless asked for.
  allow_delete: false
  # Reload the index every N seconds, which is how a run in progress is
  # watched. 0 disables it.
  live_refresh_seconds: 10

  # -------------------------------------------------------------------------
  # rl: the RL environment service (`serve --rl`).
  #
  # This is the only part of the tool that acts rather than renders -- it
  # starts sandboxes, runs the agent, and with allow_exec runs arbitrary
  # commands as this user. Hence the switch is off, and every dimension has a
  # cap. A command-line flag that is actually typed overrides the value here,
  # field by field; it does not replace the whole section.
  # See docs/rl-environment.md.
  # -------------------------------------------------------------------------
  rl:
    # Serve the /api/rl routes at all. `--rl` forces this on.
    enabled: false
    # Let a client run commands and write files inside an environment.
    # Leave this off unless the caller is a training loop you trust: on the
    # local backend it is arbitrary code execution.
    allow_exec: false
    # Environments open at once. Reaching the cap returns 429, never a
    # fabricated task failure -- "you asked too fast" and "the policy did
    # badly" must not land in the same training signal.
    max_envs: 8
    # How long one environment may stay open before the reaper destroys it.
    # The reaper runs every ttl/4, so the real maximum is up to 1.25x this.
    ttl: 15m
    # Commands per environment.
    max_execs: 20
    # Rollouts this process performs in total. 0 means unlimited.
    max_rollouts: 0
    # Cumulative agent cost cap in USD. 0 means unlimited.
    max_cost_usd: 0
